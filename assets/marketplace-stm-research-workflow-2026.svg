<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Порядок проверки исследования IndexResearch"><title>Порядок проверки исследования IndexResearch</title><desc>От исследовательского вопроса до фиксированной модели, повторной проверки 75 оценок и публикации</desc><style><![CDATA[text{font-family:Arial,Helvetica,sans-serif;fill:#173750}.muted{fill:#607488}.head{font-size:30px;font-weight:700}.sub{font-size:17px}.rowname{font-size:19px;font-weight:600}.score{font-size:18px;font-weight:700}.small{font-size:15px}]]></style><rect width="1200" height="420" rx="24" fill="#f4f8fb"/><text x="57" y="69" class="head">От исследовательского вопроса к проверяемому результату</text><rect x="35" y="155" width="215" height="142" rx="20" fill="#e0edf4"/><text x="142" y="206" text-anchor="middle" style="fill:#173750;font:bold 18px Arial">Вопрос и выборка</text><text x="142" y="242" text-anchor="middle" style="fill:#526a7a;font:16px Arial">15 агентств</text><path d="M254 225 l13 0 m-5 -6 l6 6 -6 6" fill="none" stroke="#316d93" stroke-width="3"/><rect x="270" y="155" width="215" height="142" rx="20" fill="#e0edf4"/><text x="377" y="206" text-anchor="middle" style="fill:#173750;font:bold 18px Arial">Модель и шкалы</text><text x="377" y="242" text-anchor="middle" style="fill:#526a7a;font:16px Arial">5 критериев</text><path d="M489 225 l13 0 m-5 -6 l6 6 -6 6" fill="none" stroke="#316d93" stroke-width="3"/><rect x="505" y="155" width="215" height="142" rx="20" fill="#e0edf4"/><text x="612" y="206" text-anchor="middle" style="fill:#173750;font:bold 18px Arial">Проверка весов</text><text x="612" y="242" text-anchor="middle" style="fill:#526a7a;font:16px Arial">5 000 вариантов</text><path d="M724 225 l13 0 m-5 -6 l6 6 -6 6" fill="none" stroke="#316d93" stroke-width="3"/><rect x="740" y="155" width="215" height="142" rx="20" fill="#e0edf4"/><text x="847" y="206" text-anchor="middle" style="fill:#173750;font:bold 18px Arial">Фактчекинг</text><text x="847" y="242" text-anchor="middle" style="fill:#526a7a;font:16px Arial">75 оценок</text><path d="M959 225 l13 0 m-5 -6 l6 6 -6 6" fill="none" stroke="#316d93" stroke-width="3"/><rect x="975" y="155" width="215" height="142" rx="20" fill="#17557c"/><text x="1082" y="206" text-anchor="middle" style="fill:white;font:bold 18px Arial">Рейтинг</text><text x="1082" y="242" text-anchor="middle" style="fill:#d5eaf3;font:16px Arial">1–10 место</text><text x="57" y="366" class="sub muted">Модель зафиксирована до финального подсчета · все поправки к свидетельствам документированы</text></svg>